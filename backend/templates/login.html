<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf9">
  <title>教师后台登录 · Stacey老师测评网站</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="login-page">
  <div class="page-orb one" aria-hidden="true"></div>
  <div class="page-orb two" aria-hidden="true"></div>
  <div class="page-dots one" aria-hidden="true"></div>
  <div class="page-dots two" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="返回 Stacey老师测评网站首页">
        <span class="brand-spark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M24 2c2.8 12.6 8.5 18.4 22 22-13.5 3.6-19.2 9.4-22 22C21.2 33.4 15.5 27.6 2 24 15.5 20.4 21.2 14.6 24 2Z" fill="currentColor"/></svg>
        </span>
        <span class="brand-copy"><strong>Stacey老师</strong><small>测评网站</small></span>
      </a>
      <a class="top-link" href="/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M9 12h10"/></svg>
        返回测评首页
      </a>
    </div>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-art">
        <div class="page-dots" aria-hidden="true"></div>
        <span class="eyebrow"><i></i> Teacher workspace</span>
        <h1>欢迎回来</h1>
        <p>登录后查看测试记录与学习数据</p>
        <img class="login-buddy" src="{{ url_for('static', filename='admin-buddy.svg') }}" alt="戴耳机的星星正在阅读">
      </div>

      <div class="login-form-pane">
        <span class="eyebrow"><i></i> 教师后台</span>
        <h2 id="login-title">后台管理登录</h2>
        <p>输入管理员密码，进入孩子们的测评数据中心。</p>

        {% if error %}
        <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post">
          <label class="login-label" for="pw">管理员密码</label>
          <div class="password-wrap">
            <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="pw" name="password" placeholder="请输入管理员密码" autocomplete="current-password" required autofocus>
            <button class="password-toggle" type="button" id="togglePassword" aria-label="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
          <button type="submit" class="btn btn-primary login-submit">
            登录后台
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
        <div class="login-note">仅限授权管理员使用</div>
      </div>
    </section>
  </main>

  <script>
    const toggle = document.getElementById('togglePassword');
    const password = document.getElementById('pw');
    toggle.addEventListener('click', () => {
      const showing = password.type === 'text';
      password.type = showing ? 'password' : 'text';
      toggle.setAttribute('aria-pressed', String(!showing));
      toggle.setAttribute('aria-label', showing ? '显示密码' : '隐藏密码');
      password.focus();
    });
  </script>
</body>
</html>
